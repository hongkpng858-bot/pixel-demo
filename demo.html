<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Slime hop — CSS steps() demo</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:24px;
         background:#1b1b29; color:#9aa3c7; font-family:sans-serif; }
  /* 純 CSS 動畫：sprite sheet + steps() */
  .slime {
    width:256px; height:256px;
    image-rendering: pixelated;           /* 放大唔起狗牙 */
    background: url("slime_sheet@8x.png") left center / 4096px 256px repeat-x;
    animation: hop 1.28s steps(16) infinite;  /* 16 帧 x 80ms */
  }
  @keyframes hop { from { background-position-x: 0 } to { background-position-x: -4096px } }
  code { background:#2a2a3f; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <div class="slime"></div>
  <p>純 CSS：<code>steps(16)</code> 掃 <code>slime_sheet@8x.png</code>，零 JavaScript</p>
</body>
</html>
